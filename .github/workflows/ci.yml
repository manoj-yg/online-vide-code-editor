name: CI Pipeline

on:
  push:
    branches:
      - master
      - dev-test
  pull_request:
    branches:
      - master
      - dev-test
  workflow_call:
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Validation
        run: npm run typecheck

  build-test:
    name: Next.js Production Build
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: production
      DATABASE_URL: "mongodb://127.0.0.1:27017/ci_build_dummy?directConnection=true"
      AUTH_SECRET: "ci-dummy-secret-minimum-32-characters-for-build"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Next.js Build
        run: npm run build

  docker-build-test:
    name: Docker Container Build
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: online-vide-code-editor:ci-test
          build-args: |
            DATABASE_URL=mongodb://127.0.0.1:27017/ci_build_dummy?directConnection=true
            AUTH_SECRET=ci-dummy-secret-minimum-32-characters-for-build
